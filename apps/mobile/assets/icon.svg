<!--
  The app icon: three photo sets from three people, overlapping into one.

  Kept as vector because it is drawn from a handful of numbers, and because
  every raster the stores want is a different size. `npm run icons` re-renders
  them all from this file; nothing under assets/ should be edited by hand.

  ## The three circles are a hole punched in white

  One path, three subpaths, `fill-rule="evenodd"`. A region covered by an odd
  number of circles is white and a region covered by an even number is not
  painted at all, so the three pairwise lenses are holes and the field shows
  through them. The centre — where all three meet, covered three times — is
  white again, which is the mark's own logic made literal: the part everyone
  was at is the solid part.

  This replaces seven explicitly painted regions. Those existed because the
  mark used to be drawn on white, where a transparent overlap would have been
  white too and the lenses would have vanished; the colour had to be put there
  by hand. On a field there is nothing to invent — the overlaps are wherever
  the picture underneath happens to be, which is why no two of them are the
  same colour and none of them had to be chosen.

  ## Geometry

  Three circles of radius 163, centres 132 from a point at 120° apart, first
  one straight up.

  The centres are exactly where they were. The radius was 200, which put the
  ratio at 0.66 — chosen when the mark was a small coloured shape on a page
  and needed every pixel of colour it could get at 16px. Inverted here: the
  colour is the field and the circles are the absence of it, so tighter
  circles meant less field showing and a mark that read as one white blob with
  notches. At 163 the three read as three.

  ## The field

  Six blooms over white, each fading to nothing, rather than a mesh: SVG has no
  mesh gradient that renders anywhere. Pink across the top, peach into the
  top-right, blue down the left, cyan along the bottom and mint up the right.

  The corners stay pale because nothing reaches them at full strength, which is
  the whole reason the blooms are placed outside the canvas — a gradient stop
  inside the square would put its own edge somewhere visible.

  Full bleed and fully opaque: iOS rounds the corners itself, and App Store
  Connect rejects an icon with an alpha channel. The artwork it came from was
  drawn with its corners already rounded against black; rounding here would
  round them twice and put black inside the mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!--
      Six blooms over white, and the numbers are fitted rather than chosen.

      Each was placed by eye first and then moved by a coordinate descent
      against the artwork this replaces: render, compare every pixel of field
      that is neither mark nor corner, keep whatever moved closer. The mark is
      excluded because its white says nothing about what is behind it, and the
      corners because they are black in the artwork and full bleed here.

      Which is why the centres sit where they do rather than where the eye
      would put them — the pink is not at the top edge and the blue is not at
      the left, because what each has to match is the whole field its fade
      covers and not the one sample nearest its middle.
    -->
    <radialGradient id="magenta" cx="0.214" cy="0.266" r="0.448">
      <stop offset="0" stop-color="#ea80ff"/>
      <stop offset="1" stop-color="#ea80ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.602" cy="0.160" r="0.544">
      <stop offset="0" stop-color="#ff819e"/>
      <stop offset="1" stop-color="#ff819e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="0.780" cy="0.362" r="0.234">
      <stop offset="0" stop-color="#ffc96d"/>
      <stop offset="1" stop-color="#ffc96d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.250" cy="0.696" r="0.566">
      <stop offset="0" stop-color="#428ffd"/>
      <stop offset="1" stop-color="#428ffd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.580" cy="0.818" r="0.334">
      <stop offset="0" stop-color="#60f2fa"/>
      <stop offset="1" stop-color="#60f2fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.820" cy="0.642" r="0.472">
      <stop offset="0" stop-color="#6cfac6"/>
      <stop offset="1" stop-color="#6cfac6" stop-opacity="0"/>
    </radialGradient>
    <!--
      The corners, taken back towards white.

      Every bloom fades to nothing, and that alone left the four corners far
      too saturated: a corner is 1.41 times as far from the middle as an edge
      is, and a circular fade does not know the difference. This does — it is
      clear out to 0.87 of its radius and only bites past that, which is a
      distance the edge midpoints sit inside and the corners do not.
    -->
    <radialGradient id="corners" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.870" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.440"/>
    </radialGradient>
  </defs>

  <!--
    The two halves are named because the renderer takes them apart.

    Android composites an adaptive icon from a background and a foreground and
    masks the pair to whatever shape the launcher likes, so the field goes in
    one and the mark in the other — see `render-icons.mjs`. Extracting them by
    id rather than by pattern-matching a fill, which is what it used to do and
    which broke the moment this file changed.
  -->
  <g id="field">
    <rect width="1024" height="1024" fill="#ffffff"/>
    <rect width="1024" height="1024" fill="url(#magenta)"/>
    <rect width="1024" height="1024" fill="url(#pink)"/>
    <rect width="1024" height="1024" fill="url(#peach)"/>
    <rect width="1024" height="1024" fill="url(#blue)"/>
    <rect width="1024" height="1024" fill="url(#cyan)"/>
    <rect width="1024" height="1024" fill="url(#mint)"/>
    <rect width="1024" height="1024" fill="url(#corners)"/>
  </g>

  <path id="mark" fill="#ffffff" fill-rule="evenodd" d="
    M 349 400 a 163 163 0 1 0 326 0 a 163 163 0 1 0 -326 0 Z
    M 235 598 a 163 163 0 1 0 326 0 a 163 163 0 1 0 -326 0 Z
    M 463 598 a 163 163 0 1 0 326 0 a 163 163 0 1 0 -326 0 Z
  "/>
</svg>
