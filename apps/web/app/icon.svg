<!--
  The app icon, and the tab shows what the home screen shows.

  It was the pale mark on white — the other drawing, the one `Mark.tsx`
  renders inline on a page — so the icon on somebody's phone and the icon in
  their tab strip were two different logos of one product.

  Mirrored from `appIcon.ts`, which is mirrored from
  `assets/branding/parea-icon-dark-refined.svg`, which is generated from three
  numbers by `scripts/build-icon.mjs`. Nothing here is edited by hand:
  `brand.test.ts` compares all three, so a hand edit fails rather than
  quietly leaving the website one revision behind the phone.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
