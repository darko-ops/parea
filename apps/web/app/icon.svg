<radialGradient id="gradBlue" gradientUnits="userSpaceOnUse" cx="80" cy="780" r="780"><stop offset="0%" stop-color="#1337B7" stop-opacity="1"/><stop offset="36%" stop-color="#1945C6" stop-opacity="0.96"/><stop offset="70%" stop-color="#1D49C9" stop-opacity="0.42"/><stop offset="100%" stop-color="#1D49C9" stop-opacity="0"/></radialGradient>
<radialGradient id="gradCyan" gradientUnits="userSpaceOnUse" cx="520" cy="1040" r="560"><stop offset="0%" stop-color="#25BCE6" stop-opacity="0.92"/><stop offset="38%" stop-color="#21AEDD" stop-opacity="0.68"/><stop offset="72%" stop-color="#1E9FD5" stop-opacity="0.18"/><stop offset="100%" stop-color="#1E9FD5" stop-opacity="0"/></radialGradient>
<radialGradient id="gradSeam" gradientUnits="userSpaceOnUse" cx="1010" cy="330" r="640"><stop offset="0%" stop-color="#7D37CC" stop-opacity="0.62"/><stop offset="45%" stop-color="#7D37CC" stop-opacity="0.5"/><stop offset="86%" stop-color="#7D37CC" stop-opacity="0"/></radialGradient>
<radialGradient id="gradTeal" gradientUnits="userSpaceOnUse" cx="1030" cy="760" r="760"><stop offset="0%" stop-color="#66E7C6" stop-opacity="0.95"/><stop offset="34%" stop-color="#46D8C1" stop-opacity="0.84"/><stop offset="70%" stop-color="#39CDBD" stop-opacity="0.34"/><stop offset="100%" stop-color="#39CDBD" stop-opacity="0"/></radialGradient>
</defs>
