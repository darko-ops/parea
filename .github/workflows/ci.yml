name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The test suite shells out to real tools rather than mocking them, which
      # is the point — metadata stripping is verified with exiftool and archives
      # are opened with a real unzip. Both have to exist here too.
      #
      # libheif-plugin-libde265 is the one that looks optional and is not:
      # sharp's prebuilt libvips parses the HEIF container without being able to
      # decode HEVC, so without this the HEIC tests fail in a way that reads
      # like a code bug rather than a missing package.
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl \
            libheif1 \
            libheif-plugin-libde265 \
            libheif-examples \
            unzip

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # A schema edit without a generated migration is invisible until deploy,
      # where it fails against a database that does not match the code.
      - name: Migrations match the schema
        run: |
          npm run db:generate --workspace @parea/core
          if [ -n "$(git status --porcelain packages/core/drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run:"
            echo "  npm run db:generate --workspace @parea/core"
            git --no-pager diff --stat packages/core/drizzle
            exit 1
          fi

      - name: Build the web app
        run: npm run build --workspace @parea/web
        env:
          SESSION_SECRET: ci-not-a-real-secret
          DATABASE_URL: postgres://ci/unused
